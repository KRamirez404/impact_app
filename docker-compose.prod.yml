services:
  db:
    image: postgres:16-alpine
    container_name: impactapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impactapp}
      POSTGRES_USER: ${POSTGRES_USER:-impactapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impactapp} -d ${POSTGRES_DB:-impactapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - impactapp_network

  backend:
    build:
      context: ./impactapp_backend
      dockerfile: Dockerfile.prod
    container_name: impactapp_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-impactapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-impactapp}
      UPLOAD_FOLDER: uploads
      FLASK_ENV: production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - impactapp_network

  web:
    build:
      context: .
      dockerfile: impactapp_flutter/Dockerfile.prod
      args:
        API_BASE_URL: ${API_BASE_URL:?define API_BASE_URL en .env.production}
    container_name: impactapp_web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - impactapp_network

  certbot:
    image: certbot/certbot
    container_name: impactapp_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - impactapp_network

volumes:
  postgres_data:
  uploads_data:
  certbot_certs:
  certbot_www:

networks:
  impactapp_network:
    driver: bridge
