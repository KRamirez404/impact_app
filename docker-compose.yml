services:
  db:
    image: postgres:16-alpine
    container_name: impactapp_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-impactapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-impactapp}
      - POSTGRES_DB=${POSTGRES_DB:-impactapp}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - impactapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impactapp} -d ${POSTGRES_DB:-impactapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./impactapp_backend
      dockerfile: Dockerfile
    container_name: impactapp_backend
    ports:
      - "5000:5000"
    volumes:
      - ./impactapp_backend:/app
    environment:
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-impactapp}:${POSTGRES_PASSWORD:-impactapp}@db:5432/${POSTGRES_DB:-impactapp}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - impactapp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pg_data:

networks:
  impactapp_network:
    driver: bridge
