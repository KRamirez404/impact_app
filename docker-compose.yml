services:
  db:
    image: postgres:16-alpine
    container_name: impactapp_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-impactapp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-impactapp}
      - POSTGRES_DB=${POSTGRES_DB:-impactapp}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - impactapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impactapp} -d ${POSTGRES_DB:-impactapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./impactapp_backend
      dockerfile: Dockerfile
    container_name: impactapp_backend
    ports:
      - "5000:5000"
    volumes:
      - ./impactapp_backend:/app
    environment:
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-impactapp}:${POSTGRES_PASSWORD:-impactapp}@db:5432/${POSTGRES_DB:-impactapp}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - WOMPI_ENV=${WOMPI_ENV:-sandbox}
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY:-}
      - WOMPI_PRIVATE_KEY=${WOMPI_PRIVATE_KEY:-}
      - WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET:-}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET:-}
      - WOMPI_CHECKOUT_URL=${WOMPI_CHECKOUT_URL:-https://checkout.wompi.co/p/}
      - WOMPI_API_URL=${WOMPI_API_URL:-https://sandbox.wompi.co/v1}
      - WOMPI_MIN_AMOUNT=${WOMPI_MIN_AMOUNT:-1000}
      - DONATION_REDIRECT_URL=${DONATION_REDIRECT_URL:-http://localhost:8080/donacion/resultado}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - impactapp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pg_data:

networks:
  impactapp_network:
    driver: bridge
